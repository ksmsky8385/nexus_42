apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db
spec:
  serviceName: vector-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
    spec:
      containers:
        - name: vector-db
          image: ksmsky8385/myagent-vector:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          envFrom:
            - configMapRef:
                name: vector-cm
          volumeMounts:
            - name: vector-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: vector-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
